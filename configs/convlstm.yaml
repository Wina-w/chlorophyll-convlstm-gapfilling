# The published experiment: multi-sensor fusion ConvLSTM, 3-day window, Taiwan Strait 20x20.
# Every value here reproduces the original config.py constants (docs/MIGRATION.md).
name: convlstm_fusion
experiment: chl-gapfill
task: gapfill
input_days: 3
log_transform: true
seed: 42
region:
  lat_bounds: [22.95, 24.55]
  lon_bounds: [118.10, 119.75]
data:
  train_nc: Merged_VIIRS_CHL_Daily.nc
  var_name: chlor_a
  input_sensors: null          # null = every 'input' sensor in the registry (modis_aqua, viirs_snpp, viirs_noaa20)
  fusion: true
  min_coverage: 0.2
  start: 2018-05-30            # period `chl-gapfill download` fetches (= the published target file)
  end: 2023-08-31
mask: {min_frac: 0.10, max_frac: 0.40, n_blobs: 3}
model:
  name: convlstm
  hidden_channels: [64, 32]
  kernel_size: 3
  use_norm: true
  dropout: 0.0
training:
  lr: 0.001
  n_epochs: 1000
  patience: 12
  batch_size: 16
  lr_schedule: true
  grad_clip: null
  loss: {w_hole: 1.0, w_valid: 0.1, w_grad: 0.05}
split:
  train_end: 2021-12-31
  val_start: 2022-01-01
  val_end: 2022-03-31
  test_start: 2022-04-01
  test_end: 2022-07-25
  gap_days: 0                  # published numbers used 0; set 2 (= input_days-1) for a strict gap
